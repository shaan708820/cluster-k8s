apiVersion: apps/v1
kind: Deployment

metadata:
  name: shaan-deployment
  namespace: shaan-ns
  labels:
    first: app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
        - name: shaan-container
          image: mshaan/fitness:v1.0.0

          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: shaan-config
            - secretRef:
                name: shaan-secret

---
apiVersion: v1
kind: Service
metadata:
  name: shaan-service
  namespace: shaan-ns
spec:
  type: NodePort      # Changed from ClusterIP
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 5010
      targetPort: 5000
      nodePort: 30010 # Added this (must be between 30000-32767)